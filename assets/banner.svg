<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#2d6a4f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="accents" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4fc3f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow1)"/>
  <rect width="1200" height="360" fill="url(#glow2)"/>

  <!-- Decorative shapes -->
  <circle cx="100" cy="80" r="120" fill="url(#accents)"/>
  <circle cx="1100" cy="280" r="150" fill="url(#accents)"/>
  <circle cx="600" cy="180" r="200" fill="url(#accents)" opacity="0.5"/>

  <!-- Orbiting decorative circles -->
  <circle cx="180" cy="120" r="2" fill="#4fc3f7" opacity="0.3"/>
  <circle cx="200" cy="140" r="1.5" fill="#4fc3f7" opacity="0.2"/>
  <circle cx="160" cy="150" r="1" fill="#4fc3f7" opacity="0.25"/>
  <circle cx="1020" cy="220" r="2" fill="#4fc3f7" opacity="0.3"/>
  <circle cx="1050" cy="200" r="1.5" fill="#4fc3f7" opacity="0.2"/>
  <circle cx="990" cy="240" r="1" fill="#4fc3f7" opacity="0.25"/>
  <circle cx="300" cy="270" r="1.5" fill="#4fc3f7" opacity="0.2"/>
  <circle cx="900" cy="100" r="1.5" fill="#4fc3f7" opacity="0.2"/>
  <circle cx="850" cy="130" r="1" fill="#4fc3f7" opacity="0.15"/>
  <circle cx="350" cy="90" r="1" fill="#4fc3f7" opacity="0.15"/>

  <!-- Connecting lines -->
  <line x1="100" y1="280" x2="300" y2="280" stroke="url(#line)" stroke-width="0.5"/>
  <line x1="900" y1="80" x2="1100" y2="80" stroke="url(#line)" stroke-width="0.5"/>
  <line x1="50" y1="180" x2="200" y2="180" stroke="url(#line)" stroke-width="0.3"/>
  <line x1="1000" y1="180" x2="1150" y2="180" stroke="url(#line)" stroke-width="0.3"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="90" x2="1200" y2="90" stroke="#ffffff" stroke-opacity="0.02" stroke-width="0.5"/>
  <line x1="0" y1="270" x2="1200" y2="270" stroke="#ffffff" stroke-opacity="0.02" stroke-width="0.5"/>

  <!-- Decorative bracket shapes -->
  <path d="M 0 0 L 0 40" stroke="#4fc3f7" stroke-opacity="0.15" stroke-width="1" fill="none"/>
  <path d="M 0 0 L 40 0" stroke="#4fc3f7" stroke-opacity="0.15" stroke-width="1" fill="none"/>
  <path d="M 1200 360 L 1200 320" stroke="#4fc3f7" stroke-opacity="0.15" stroke-width="1" fill="none"/>
  <path d="M 1200 360 L 1160 360" stroke="#4fc3f7" stroke-opacity="0.15" stroke-width="1" fill="none"/>

  <!-- Content -->
  <g text-anchor="middle">
    <!-- Headline -->
    <text x="600" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="56.0" font-weight="700" fill="#ffffff">
      <tspan x="600" dy="0">Gemini 2.0 Pro 2M Context</tspan>
    </text>

    <!-- Accent line under headline -->
    <line x1="420" y1="185" x2="780" y2="185" stroke="#4fc3f7" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Tagline -->
    <text x="600" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="21.0" font-weight="400" fill="#c9d1d9">
      <tspan x="600" dy="0">Gemini 2.0 Pro context manager for researchers — organize</tspan>
      <tspan x="600" dy="30">long docs and chats into a single 2M-token workspac…</tspan>
    </text>
  </g>
</svg>